# Publishes n8n-nodes-fiwano to npm on every version tag push.
#
# Auth: npm Trusted Publishing (OIDC) — no NPM_TOKEN. GitHub mints a short-lived
# OIDC token (id-token: write), npm trusts it because the package is configured
# with this repo + workflow as a Trusted Publisher (npmjs.com -> package
# Settings -> Trusted Publisher). This replaces the deprecated 2FA-bypass
# Granular Access Token (npm is removing direct publishing for those by ~Jan 2027
# — https://github.blog/changelog/2026-07-08-npm-install-time-security-and-gat-bypass2fa-deprecation/).
#
# Provenance (--provenance) is generated automatically from the same OIDC token,
# so the npm page keeps its "built and signed on GitHub Actions" attestation.
#
# ─── ONE-TIME SETUP (already done) ───────────────────────────────────────
#
# On npmjs.com: n8n-nodes-fiwano -> Settings -> Trusted Publisher -> GitHub
#   Actions -> owner: fiwano-com, repo: n8n-nodes-fiwano, workflow: publish.yml.
# No repository secret is required.
#
# ─── RELEASE PROCESS ─────────────────────────────────────────────────────
#
# From the project directory:
#   npm version patch    # or minor / major
#   git push && git push --tags
#
# This triggers the workflow which builds, lints, and publishes to npm.

name: Publish to npm

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest

    permissions:
      # OIDC token for npm Trusted Publishing + provenance attestation
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing (OIDC) needs npm >= 11.5.0; Node 22 ships npm 10.x.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # No NODE_AUTH_TOKEN: auth comes from the OIDC token via Trusted Publishing.
      - name: Publish to npm
        run: npm publish --provenance --access public
